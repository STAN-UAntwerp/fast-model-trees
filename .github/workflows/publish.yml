name: Publish Python Package

on:
  push:
    tags:
      - 'v*.*.*'
  # manual dry run: builds wheels and sdist from a branch, does not publish
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned (not macos-latest): Homebrew dylibs target the runner's macOS version,
        # which must match MACOSX_DEPLOYMENT_TARGET in pyproject.toml for delocate.
        # macos-latest moved to macOS 26, which would make the wheel macOS 26+ only.
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: get_version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Update version in pyproject.toml
      if: startsWith(github.ref, 'refs/tags/v')
      shell: python
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        import re, os
        version = os.environ["VERSION"]
        with open("pyproject.toml") as f:
            content = f.read()
        content = re.sub(r'^version = ".*"', f'version = "{version}"', content, flags=re.MULTILINE)
        with open("pyproject.toml", "w") as f:
            f.write(content)

    - name: Install cibuildwheel
      run: pip install cibuildwheel==3.3.1

    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Update version in pyproject.toml
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

    - name: Build sdist
      run: |
        pip install build
        python -m build --sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Install twine
      run: pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*
