name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Linux ────────────────────────────────────────────────────────────
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libarmadillo-dev libopenblas-dev liblapack-dev ninja-build

      # ── macOS ────────────────────────────────────────────────────────────
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install armadillo ninja

      - name: Set MACOSX_DEPLOYMENT_TARGET (macOS)
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      # ── Windows ──────────────────────────────────────────────────────────
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install armadillo:x64-windows

      # ── Build & install ──────────────────────────────────────────────────
      - name: Build and install package (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SKBUILD_CMAKE_ARGS: "-GNinja"
        run: pip install -e ".[dev]" -v

      # An editable install cannot load the vcpkg DLLs (armadillo, OpenBLAS): Python does not
      # search PATH for the dependencies of extension modules. Test the wheel as it is published
      # instead, with the DLLs bundled by delvewheel (same as repair-wheel-command in pyproject.toml).
      - name: Build, repair and install wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install delvewheel
          pip wheel . --no-deps -w dist_raw -v
          delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin -w dist dist_raw/*.whl
          pip install "$(ls dist/*.whl)[dev]"

      # ── Tests ────────────────────────────────────────────────────────────
      # importlib mode keeps the repo root off sys.path, so the installed package is imported
      # rather than the source folder pilot/ (which has no compiled extension on Windows)
      - name: Run tests
        run: pytest tests/ -v --tb=short --import-mode=importlib
