[build-system]
requires = [
    "scikit-build-core>=0.3.3",
    "pybind11>=2.10.0",
    "numpy>=1.20.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "fast-model-trees"
version = "0.2.0"
description = "PILOT and RaFFLE: Piecewise Linear Organic Trees and Random Forest Featuring Linear Extensions"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Thomas Servotte", email = "thomas.servotte@uantwerpen.be"},
    {name = "Jakob Raymaekers", email = "jakob.raymaekers@uantwerpen.be"},
    {name = "Ruicong Yao", email = "ruicong.yao@ugent.be"}
]
keywords = ["machine learning", "decision trees", "random forest", "regression", "piecewise linear"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.8",
    "matplotlib>=3.7.5",
    "networkx>=3.1",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pmlb>=1.0.1.post3",
    "psutil>=7.1.3",
    "retry>=0.9.2",
    "scikit-learn>=1.0.0",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
    "xgboost>=2.1.4",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "jupyter>=1.0.0",
    "pytest>=7.0.0",
]
benchmarks = [
    "matplotlib>=3.5.0",
    "networkx>=3.0",
    "seaborn>=0.11.0",
    "ucimlrepo",
    "xgboost",
    "retry",
    "dataframe-image",
    "click",
    "tabulate",
]

[project.urls]
Homepage = "https://github.com/STAN-UAntwerp/fast-model-trees"
Documentation = "https://github.com/STAN-UAntwerp/fast-model-trees#readme"
Repository = "https://github.com/STAN-UAntwerp/fast-model-trees"
Issues = "https://github.com/STAN-UAntwerp/fast-model-trees/issues"

[tool.scikit-build]
cmake.version = ">=3.12"
cmake.source-dir = "."
build-dir = "build/{wheel_tag}"
wheel.packages = ["pilot"]
build.verbose = true

[tool.cibuildwheel]
build = "cp31*"  # covers Python 3.10–3.19 (no annual updates needed)
skip = ["*-win32", "*-musllinux_*", "pp*"]

[tool.cibuildwheel.linux]
# Use Ninja generator on Linux for faster builds (scikit-build-core reads CMAKE_ARGS)
environment = {SKBUILD_CMAKE_ARGS = "-GNinja"}
# Install Armadillo + BLAS/LAPACK from EPEL, fall back to building Armadillo from source
before-all = """
yum install -y epel-release || true
yum install -y blas-devel lapack-devel || true
yum install -y armadillo-devel || (
    cd /tmp &&
    curl -fsSL "https://sourceforge.net/projects/arma/files/armadillo-12.6.7.tar.xz/download" -o armadillo.tar.xz &&
    tar xf armadillo.tar.xz &&
    cmake -S armadillo-12.6.7 -B armadillo-build -DCMAKE_INSTALL_PREFIX=/usr/local &&
    cmake --build armadillo-build --target install
)
"""
archs = ["x86_64"]

[tool.cibuildwheel.macos]
# Homebrew on the macos-latest (macOS 15) runner builds for macOS 15.
# We set MACOSX_DEPLOYMENT_TARGET=15.0 so the wheel's declared target
# matches the dylibs, satisfying delocate's compatibility check.
before-all = "brew install armadillo"
archs = ["arm64"]
environment = {MACOSX_DEPLOYMENT_TARGET = "15.0", SKBUILD_CMAKE_ARGS = "-GNinja"}

[tool.cibuildwheel.windows]
# vcpkg is pre-installed on GitHub Actions Windows runners.
# CMakeLists.txt auto-detects VCPKG_INSTALLATION_ROOT to set the toolchain file.
before-all = "vcpkg install armadillo:x64-windows"
archs = ["AMD64"]
# delvewheel bundles the vcpkg DLLs (armadillo, OpenBLAS, etc.) into the wheel,
# equivalent to auditwheel on Linux and delocate on macOS.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin -w {dest_dir} {wheel}"
