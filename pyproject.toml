[build-system]
requires = [
    "scikit-build-core>=0.3.3",
    "pybind11>=2.10.0",
    "numpy>=1.20.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "fast-model-trees"
version = "0.1.1"
description = "PILOT and RaFFLE: Piecewise Linear Organic Trees and Random Forest Featuring Linear Extensions"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Thomas Servotte", email = "thomas.servotte@uantwerpen.be"},
    {name = "Jakob Raymaekers", email = "jakob.raymaekers@uantwerpen.be"},
    {name = "Ruicong Yao", email = "ruicong.yao@ugent.be"}
]
keywords = ["machine learning", "decision trees", "random forest", "regression", "piecewise linear"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "jupyter>=1.0.0",
    "pytest>=7.0.0",
]
benchmarks = [
    "matplotlib>=3.5.0",
    "networkx>=3.0",
    "seaborn>=0.11.0",
    "ucimlrepo",
    "xgboost",
    "retry",
    "dataframe-image",
    "click",
    "tabulate",
]

[project.urls]
Homepage = "https://github.com/STAN-UAntwerp/fast-model-trees"
Documentation = "https://github.com/STAN-UAntwerp/fast-model-trees#readme"
Repository = "https://github.com/STAN-UAntwerp/fast-model-trees"
Issues = "https://github.com/STAN-UAntwerp/fast-model-trees/issues"

[tool.scikit-build]
cmake.version = ">=3.12"
cmake.source-dir = "."
# Use Ninja generator on all platforms - avoids NMake issues on Windows
# (scikit-build-core installs cmake + ninja as Python packages automatically)
cmake.args = ["-GNinja"]
build-dir = "build/{wheel_tag}"
wheel.packages = ["pilot"]
build.verbose = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["*-win32", "*-musllinux_*", "pp*"]

[tool.cibuildwheel.linux]
# Install Armadillo + BLAS/LAPACK from EPEL, fall back to building Armadillo from source
before-all = """
yum install -y epel-release || true
yum install -y blas-devel lapack-devel || true
yum install -y armadillo-devel || (
    cd /tmp &&
    curl -fsSL "https://sourceforge.net/projects/arma/files/armadillo-12.6.7.tar.xz/download" -o armadillo.tar.xz &&
    tar xf armadillo.tar.xz &&
    cmake -S armadillo-12.6.7 -B armadillo-build -DCMAKE_INSTALL_PREFIX=/usr/local &&
    cmake --build armadillo-build --target install
)
"""
archs = ["x86_64"]

[tool.cibuildwheel.macos]
# Build Armadillo from source to control the deployment target and avoid
# Homebrew pulling in MPI/HDF5 dylibs compiled for macOS 15.
# macOS provides BLAS/LAPACK via the built-in Accelerate framework.
before-all = """
curl -fsSL "https://sourceforge.net/projects/arma/files/armadillo-12.6.7.tar.xz/download" -o /tmp/armadillo.tar.xz
tar -C /tmp -xf /tmp/armadillo.tar.xz
cmake -S /tmp/armadillo-12.6.7 -B /tmp/armadillo-build \
    -DCMAKE_INSTALL_PREFIX=/usr/local \
    -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
    -DDETECT_HDF5=OFF
cmake --build /tmp/armadillo-build --target install
"""
archs = ["arm64"]
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}

[tool.cibuildwheel.windows]
# vcpkg is pre-installed on GitHub Actions Windows runners.
# CMakeLists.txt auto-detects VCPKG_INSTALLATION_ROOT to set the toolchain file.
before-all = "vcpkg install armadillo:x64-windows"
archs = ["AMD64"]
